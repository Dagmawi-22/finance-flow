spring:
  application:
    name: finance-flow

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:financeflow}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

financeflow:
  wallet:
    default-currency: ${WALLET_DEFAULT_CURRENCY:ETB}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-32chars-min}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  limits:
    max-per-transaction: ${MAX_PER_TRANSACTION:1000000}
    max-daily-outgoing: ${MAX_DAILY_OUTGOING:5000000}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
    lock-seconds: ${IDEMPOTENCY_LOCK_SECONDS:30}
